#
#  project.yml — XcodeGen tanımı
#
#  Xcode projesi depoda tutulmaz (pbxproj birleştirme kâbusu). Bunun yerine:
#      brew install xcodegen && xcodegen generate && open AuraVoice.xcodeproj
#  CI de aynı komutu çalıştırır, böylece yerel ve uzak derleme birebir aynıdır.
#

name: AuraVoice

options:
  bundleIdPrefix: com.auravoice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 dilinde zaten "complete" geçerlidir; Swift 5 moduna düşüldüğünde
    # de aynı katılığı korumak için açıkça yazıldı.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  # WhisperKit artık argmax-oss-swift paketinin altında yayınlanıyor.
  # Cihaz içi ASR (Core ML / Apple Neural Engine) için tek dış bağımlılık.
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 0.9.0

targets:

  AuraVoice:
    type: application
    platform: iOS
    sources:
      # Normal kaynak agaci. Gomulu tokenizer klasoru DISLANIYOR: aksi halde
      # XcodeGen onu ayrica "group" olarak da ekliyor, JSON'lari tek tek Copy
      # Bundle Resources'a koyuyor ve dizin yapisini duzlestiriyor -- iki
      # tokenizer.json cakisip "Multiple commands produce" hatasi veriyor.
      - path: AuraVoice
        excludes:
          - "Resources/Tokenizers/**"
      # KLASOR REFERANSI: alt agac .app icinde birebir korunmali. WhisperKit
      # tokenizer'i once <kok>/models/<repoID>, sonra duz <kok> altinda ariyor.
      - path: AuraVoice/Resources/Tokenizers
        name: Tokenizers
        type: folder
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      # Konusmaci ayristirma (Pyannote v4) - ayni paketin urunu.
      - package: ArgmaxOSS
        product: SpeakerKit
      # Widget uzantisi uygulamaya gomulur (XcodeGen embed adimini kendisi ekler).
      - target: AuraVoiceWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auravoice.app
        PRODUCT_NAME: AuraVoice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Support/AuraVoice.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Cihaz derlemesi için kendi takım kimliğini gir ya da Xcode'da
        # "Automatically manage signing" işaretle.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: AuraVoice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Boş sözlük = varsayılan (düz renk) açılış ekranı. Bu anahtar
        # olmadan iOS uygulamayı küçük ekran modunda başlatır.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false

        # --- İzin metinleri (App Store reddi almamak için gerekçe net yazıldı)
        NSMicrophoneUsageDescription: >-
          Toplantı ve görüşmelerini kaydedip özet çıkarabilmek için mikrofona
          erişiyoruz. Offline modda ses cihazından hiç çıkmaz.
        NSCalendarsFullAccessUsageDescription: >-
          Yaklaşan toplantılarını cihazda tarayıp kayıt hatırlatması
          gönderebilmek için takvimine erişiyoruz. Etkinlik verisi hiçbir
          sunucuya gönderilmez.
        NSSpeechRecognitionUsageDescription: >-
          Kaydettiğin sesi metne dönüştürmek için konuşma tanıma kullanılıyor.

        # --- Arka planda kayıt (ekran kilitlendiğinde kaydın kesilmemesi için)
        UIBackgroundModes:
          - audio

  AuraVoiceWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AuraVoiceWidget
      # App Group sinirindaki TEK ortak dosya. Uygulamanin geri kalani
      # uzantiya girmiyor; gerekcesi dosyanin basinda yazili.
      - path: AuraVoice/Core/Intents/SharedLaunchContract.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auravoice.app.widget
        PRODUCT_NAME: AuraVoiceWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Support/AuraVoiceWidget.entitlements
        SKIP_INSTALL: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Support/AuraVoiceWidget-Info.plist
      properties:
        CFBundleDisplayName: AuraVoice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AuraVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AuraVoiceTests
    dependencies:
      - target: AuraVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auravoice.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AuraVoice:
    build:
      targets:
        AuraVoice: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AuraVoiceTests
    archive:
      config: Release

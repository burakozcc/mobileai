name: iOS Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    # WhisperKit (Core ML) paketinin çözümlenip derlenmesi süreyi uzatıyor.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      # Swift 6 için Xcode 16+ şart.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # llama.xcframework depoda tutulmuyor (25 MB ikili). Etikete gore
      # cache'leniyor; yalnizca ilk kosu 286 MB indiriyor.
      - name: Cache llama.xcframework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Vendor/llama.xcframework
          key: llama-xcframework-b10456

      - name: Fetch llama.xcframework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash Tools/fetch-llama.sh

      # Guncel llama.cpp release'lerinde iOS simulator dilimi YOK (PR #27252).
      # Testler simulatorde kostugu icin dilim eksikse derleme "no library for
      # this platform" ile patlar -- erken ve net soyleyelim.
      - name: Verify simulator slice
        run: |
          PLIST=Vendor/llama.xcframework/Info.plist
          SLICES=$(/usr/libexec/PlistBuddy -c "Print :AvailableLibraries" "$PLIST")
          echo "$SLICES" | grep LibraryIdentifier
          if ! echo "$SLICES" | grep -q "ios-arm64_x86_64-simulator"; then
            echo "::error::llama.xcframework icinde iOS simulator dilimi yok - testler linklenemez"
            exit 1
          fi
          echo "Simulator dilimi dogrulandi."

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # Runner imajındaki simülatör isimleri sürümle değişiyor; ismi sabitlemek
      # yerine mevcut olanlardan birinin UDID'sini alıyoruz.
      - name: Resolve simulator destination
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "Uygun iPhone simülatörü bulunamadı"
            exit 1
          fi
          echo "Seçilen simülatör: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # xcpretty runner imajında garanti değil — çıktıyı ham bırakıyoruz ki
      # derleme hatası yerine boru hattı hatası almayalım.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project AuraVoice.xcodeproj \
            -scheme AuraVoice \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build-results.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project AuraVoice.xcodeproj \
            -scheme AuraVoice \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath test-results.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Upload result bundles on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-bundles
          path: |
            build-results.xcresult
            test-results.xcresult
          retention-days: 5
          if-no-files-found: ignore

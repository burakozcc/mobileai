name: iOS Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Swift 6 için Xcode 16+ şart.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # Runner imajındaki simülatör isimleri sürümle değişiyor; derleme
      # patlarsa hangi cihazların mevcut olduğunu loglardan görebilelim.
      - name: List simulators
        run: xcrun simctl list devices available

      - name: Resolve simulator destination
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];\
c=[v for k,v in d.items() if 'iOS' in k];\
f=[x for r in c for x in r if 'iPhone' in x['name']];\
print(f[-1]['udid'] if f else '')")
          if [ -z "$UDID" ]; then echo 'Uygun iPhone simülatörü bulunamadı'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project AuraVoice.xcodeproj \
            -scheme AuraVoice \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AuraVoice.xcodeproj \
            -scheme AuraVoice \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: derived-data-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/**
          retention-days: 5
          if-no-files-found: ignore
